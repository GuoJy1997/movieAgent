<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1" /><title>保存 API 凭据</title>
<link rel="stylesheet" href="./form.css" /></head>
<body><main><h1>保存 API 凭据</h1><p>凭据由系统保护。工作台仅接收引用与保存状态。</p>
<form autocomplete="off"><label for="secret">API Key</label><input id="secret" type="password" autocomplete="off" spellcheck="false" maxlength="8192" required />
<p id="protection" role="status">正在检查系统保护…</p>
<label class="session"><input id="session" type="checkbox" />仅本次会话保存（退出后失效）</label>
<button id="save" type="submit" disabled>安全保存</button><button id="revoke" type="button" hidden>紧急撤销当前凭据</button>
<p id="message" role="alert"></p></form></main><script type="module" src="./form.ts"></script></body></html>
