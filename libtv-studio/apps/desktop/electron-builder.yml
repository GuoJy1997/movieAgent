appId: studio.libtv.desktop
productName: MovieAgent
executableName: MovieAgent
copyright: Copyright © 2026 MovieAgent
artifactName: MovieAgent-${version}-local-test-Setup.${ext}
extraMetadata:
  productName: MovieAgent
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
npmRebuild: false
extraResources:
  - from: src/renderer/features/canvas/TABLER-LICENSE.txt
    to: licenses/TABLER-ICONS.txt
  - from: resources/media-runtime/win32-x64
    to: media-runtime/win32-x64
    filter:
      - '**/*'
win:
  target: nsis
  signExecutable: false
nsis:
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
